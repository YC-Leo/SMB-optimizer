name: validation

on:
  workflow_dispatch:

jobs:
  benchmark-optimum:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Reproduce the benchmark optimum
        run: python validation/benchmark_optimum.py
