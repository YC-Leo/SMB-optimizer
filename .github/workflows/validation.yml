name: validation

# Manual run: reproduces the benchmark optimum (validation/benchmark_optimum.py).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark-optimum:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install --no-deps -e .
      - name: Reproduce the benchmark optimum
        run: python validation/benchmark_optimum.py
      - uses: actions/upload-artifact@v7
        with:
          name: benchmark-results
          path: validation/benchmark_results.md
